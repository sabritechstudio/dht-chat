<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHT</title>
    <link rel="stylesheet" href="style.css?v=5" />
  </head>
  <body>
    <button
      class="menu-toggle-btn"
      id="menu-toggle-btn"
      aria-label="Toggle Navigation Sidebar"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="clay-sidebar" id="clay-sidebar">
      <div class="sidebar-header">
        <div class="brand">DHT</div>
      </div>

      <button class="clay-btn" id="new-chat-btn">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        New Thread
      </button>

      <input
        type="text"
        id="search-input"
        class="setting-input"
        placeholder="Search chats (Alt+K)"
        autocomplete="off"
        spellcheck="false"
      />

      <div class="section-divider">Conversations</div>

      <div class="history-scroll" id="history-list"></div>

      <button class="clay-btn" id="settings-btn">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
        Settings
      </button>
    </aside>

    <main class="main-window">
      <div class="chat-viewport" id="chat-container"></div>

      <button
        class="scroll-bottom-btn"
        id="scroll-bottom-btn"
        aria-label="Scroll to bottom"
        type="button"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <polyline points="19 12 12 19 5 12" />
        </svg>
      </button>

      <footer class="interaction-dock">
        <div class="card input-bar-container">
          <textarea
            id="user-input"
            rows="1"
            placeholder="How can I help you today?"
            autocomplete="off"
          ></textarea>
          <button id="send-btn" class="clay-send-btn" aria-label="Send Message">
            <span class="icon-send">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </span>
            <span class="icon-stop">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <rect x="5" y="5" width="14" height="14" rx="3" />
              </svg>
            </span>
          </button>
        </div>
      </footer>
    </main>

    <div class="modal-backdrop" id="settings-modal">
      <div
        class="card modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <div class="modal-head">
          <h2 id="settings-title">Settings</h2>
          <button
            class="modal-close"
            id="settings-close"
            aria-label="Close Settings"
            type="button"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <div class="setting-group">
          <div class="section-divider">Theme</div>
          <div class="theme-grid" id="theme-grid"></div>
        </div>

        <div class="setting-group">
          <div class="section-divider">Server Endpoint</div>
          <div class="endpoint-row">
            <input
              type="text"
              id="endpoint-input"
              placeholder="https://your-tunnel.trycloudflare.com"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="endpoint-save" id="endpoint-save">
              Save
            </button>
          </div>
        </div>

        <div class="setting-group">
          <div class="section-divider">Model</div>
          <input
            type="text"
            id="model-input"
            class="setting-input"
            placeholder="gemma3:4b"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="setting-hint">Must match a model installed in Ollama.</div>
        </div>

        <div class="setting-group">
          <div class="section-divider">Creativity</div>
          <div class="slider-row">
            <input
              type="range"
              id="temp-input"
              min="0"
              max="1"
              step="0.1"
              value="0.5"
            />
            <span id="temp-value">0.5</span>
          </div>
          <div class="setting-hint">Lower is more focused, higher is more creative.</div>
        </div>

        <div class="setting-group">
          <div class="section-divider">Custom Instructions</div>
          <textarea
            id="instructions-input"
            class="setting-input"
            rows="3"
            maxlength="600"
            placeholder="How should DHT answer? (optional)"
          ></textarea>
        </div>

        <div class="setting-group">
          <div class="section-divider">Memory</div>
          <label class="toggle-row" for="memory-toggle">
            <input type="checkbox" id="memory-toggle" />
            Use memory in replies
          </label>
          <label class="toggle-row" for="auto-memory-toggle">
            <input type="checkbox" id="auto-memory-toggle" />
            Learn facts automatically (slower)
          </label>
          <div class="memory-list" id="memory-list"></div>
          <div class="endpoint-row">
            <input
              type="text"
              id="memory-input"
              class="setting-input"
              placeholder="Add a fact to remember"
              autocomplete="off"
              maxlength="140"
            />
            <button type="button" class="endpoint-save" id="memory-add">
              Add
            </button>
          </div>
          <div class="btn-row">
            <button type="button" class="setting-btn danger" id="memory-clear">
              Clear Memory
            </button>
          </div>
          <div class="setting-hint">
            Tip: type "remember that ..." or "forget ..." in the chat.
          </div>
        </div>

        <div class="setting-group">
          <div class="section-divider">Data</div>
          <div class="btn-row">
            <button type="button" class="setting-btn" id="export-btn">
              Export
            </button>
            <button type="button" class="setting-btn" id="import-btn">
              Import
            </button>
            <button type="button" class="setting-btn danger" id="clear-chats-btn">
              Delete All Chats
            </button>
          </div>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </div>
      </div>
    </div>

    <script src="script.js?v=5"></script>
  </body>
</html>
